<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">NeVision Win application icon</title>
  <desc id="desc">Violet application icon with a dark abstract N and lime activity indicator.</desc>
  <defs>
    <linearGradient id="bg" x1="153" y1="106" x2="880" y2="905" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B49DFF"/>
      <stop offset=".46" stop-color="#8B6DFF"/>
      <stop offset="1" stop-color="#5D43D4"/>
    </linearGradient>
    <linearGradient id="shine" x1="174" y1="126" x2="709" y2="673" gradientUnits="userSpaceOnUse">
      <stop stop-color="white" stop-opacity=".45"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="60" y="68" width="904" height="908" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="28" stdDeviation="34" flood-color="#080C19" flood-opacity=".42"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="240" fill="#0B1020"/>
  <g filter="url(#shadow)">
    <rect x="112" y="104" width="800" height="816" rx="230" fill="url(#bg)"/>
    <rect x="129" y="121" width="766" height="782" rx="213" stroke="url(#shine)" stroke-width="34"/>
    <path d="M330 704V328L672 704V328" stroke="#11182A" stroke-width="92" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="725" cy="292" r="80" fill="#C7F83A" stroke="#F1FFCE" stroke-width="28"/>
  </g>
</svg>
