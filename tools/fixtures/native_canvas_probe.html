<!doctype html><html><head><meta charset="utf-8"></head><body>
<pre id="result">pending</pre><img alt="load barrier" src="/barrier?token=__TOKEN__">
<script>
(async () => {
  const paint = canvas => {
    const context = canvas.getContext('2d', {willReadFrequently: true});
    context.fillStyle = 'rgb(43,87,131)';
    context.fillRect(0, 0, canvas.width, canvas.height);
    context.fillStyle = 'rgb(198,146,72)';
    context.fillRect(2, 3, 9, 7);
    return context;
  };
  const pixels = context => Array.from(context.getImageData(0, 0, 32, 24).data);
  const equal = (left, right) => left.length === right.length && left.every((value, index) => value === right[index]);
  const hash = values => values.reduce((acc, value) => Math.imul(acc ^ value, 16777619) >>> 0, 2166136261);
  const canvas = document.createElement('canvas');
  canvas.width = 32;
  canvas.height = 24;
  const context = paint(canvas);
  const first = pixels(context);
  const second = pixels(context);
  const region = Array.from(context.getImageData(4, 5, 7, 8).data);
  let regionMatches = true;
  for (let y = 0; y < 8; y++) for (let x = 0; x < 7; x++) for (let channel = 0; channel < 4; channel++) {
    if (region[(y * 7 + x) * 4 + channel] !== first[((y + 5) * 32 + x + 4) * 4 + channel]) regionMatches = false;
  }
  const png1 = canvas.toDataURL('image/png');
  const png2 = canvas.toDataURL('image/png');
  const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
  const decoded = await createImageBitmap(blob);
  const decodedCanvas = document.createElement('canvas');
  decodedCanvas.width = 32;
  decodedCanvas.height = 24;
  const decodedContext = decodedCanvas.getContext('2d', {willReadFrequently: true});
  decodedContext.drawImage(decoded, 0, 0);
  const pngDecodedMatches = equal(first, pixels(decodedContext));
  decoded.close();

  const offscreen = new OffscreenCanvas(32, 24);
  const offscreenContext = paint(offscreen);
  const offscreenPixels = pixels(offscreenContext);
  const offscreenBlob = await offscreen.convertToBlob({type: 'image/png'});
  const offscreenBitmap = await createImageBitmap(offscreenBlob);
  decodedContext.clearRect(0, 0, 32, 24);
  decodedContext.drawImage(offscreenBitmap, 0, 0);
  const offscreenPngDecodedMatches = equal(first, pixels(decodedContext));
  offscreenBitmap.close();

  const workerSource = `const paint = ${paint.toString()};
    const pixels = ${pixels.toString()}; const hash = ${hash.toString()};
    onmessage = async () => {
      try {
        const offscreen = new OffscreenCanvas(32, 24);
        const context = paint(offscreen);
        const first = pixels(context);
        const blob = await offscreen.convertToBlob({type: 'image/png'});
        const bitmap = await createImageBitmap(blob);
        const target = new OffscreenCanvas(32, 24).getContext('2d', {willReadFrequently: true});
        target.drawImage(bitmap, 0, 0);
        bitmap.close();
        const decoded = pixels(target);
        postMessage({pixelHash: hash(first), decodedMatches: first.every((value, index) => value === decoded[index])});
      } catch (error) { postMessage({error: String(error)}); }
    };`;
  const workerUrl = URL.createObjectURL(new Blob([workerSource], {type: 'text/javascript'}));
  const worker = new Worker(workerUrl);
  let workerResult;
  try {
    workerResult = await new Promise((resolve, reject) => {
      worker.onmessage = event => resolve(event.data);
      worker.onerror = reject;
      worker.postMessage(null);
    });
  } finally {
    worker.terminate();
    URL.revokeObjectURL(workerUrl);
  }

  const afterExport = pixels(context);
  context.clearRect(0, 0, 32, 24);
  const clear = pixels(context);
  const report = {
    pixelHash: hash(first), pngHash: hash(Array.from(png1).map(character => character.charCodeAt(0))),
    repeatMatches: equal(first, second),
    regionMatches, pngRepeatMatches: png1 === png2,
    pngDecodedMatches, offscreenMatchesMain: equal(first, offscreenPixels), offscreenPngDecodedMatches,
    workerMatchesMain: workerResult.pixelHash === hash(first) && workerResult.decodedMatches === true,
    exportPreservesBacking: equal(first, afterExport),
    clearIsTransparent: clear.every(value => value === 0)
  };
  document.getElementById('result').textContent = JSON.stringify(report);
  await fetch('/report?token=__TOKEN__', {method: 'POST',
    headers: {'Content-Type': 'application/json'}, body: JSON.stringify(report)});
})().catch(async error => {
  const report = {error: String(error)};
  document.getElementById('result').textContent = JSON.stringify(report);
  await fetch('/report?token=__TOKEN__', {method: 'POST',
    headers: {'Content-Type': 'application/json'}, body: JSON.stringify(report)});
});
</script></body></html>
