<script>
const config = __CONFIG__;
const hash = bytes => Array.from(bytes).reduce((value, byte) => Math.imul(value ^ byte, 16777619) >>> 0, 2166136261);
async function measure() {
  const canvas = document.createElement('canvas');
  canvas.width = 32;
  canvas.height = 24;
  const context = canvas.getContext('2d', {willReadFrequently: true});
  context.fillStyle = 'rgb(43,87,131)';
  context.fillRect(0, 0, 32, 24);
  context.fillStyle = 'rgb(198,146,72)';
  context.fillRect(2, 3, 9, 7);
  const pixels = context.getImageData(0, 0, 32, 24).data;
  const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
  if (!blob) throw Error('PNG export unavailable');
  return {pixelHash: hash(pixels), pngHash: hash(new Uint8Array(await blob.arrayBuffer()))};
}
function timed(port, start, stop, timeoutCode = 'WorkerReplyTimeout') {
  return new Promise(resolve => {
    const timeout = setTimeout(() => { stop(); resolve({error: true, errorClass: timeoutCode}); }, 12000);
    port.onmessage = event => { clearTimeout(timeout); stop(); resolve(event.data); };
    port.onmessageerror = () => { clearTimeout(timeout); stop(); resolve({error: true}); };
    try { start(); } catch (_) { clearTimeout(timeout); stop(); resolve({error: true}); }
  });
}
async function frame(url, expectedOrigin) {
  const node = document.createElement('iframe');
  node.hidden = true;

    const timeout = setTimeout(() => { cleanup(); resolve({error: true}); }, 12000);
    function cleanup() { clearTimeout(timeout); removeEventListener('message', receive); node.remove(); }
    function receive(event) {
      if (event.source !== node.contentWindow || event.origin !== expectedOrigin ||
          !event.data || event.data.token !== config.token) return;
      cleanup(); resolve(event.data.measurement);
    }
    addEventListener('message', receive);
    node.src = url;
    document.body.append(node);
  });

}
async function dedicated() {

}

(async () => {
