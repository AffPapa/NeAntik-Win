name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The CI only checks a checkout. It never receives release/signing secrets and cannot publish.
permissions:
  contents: read

jobs:
  verify:
    name: Verify source and release tooling
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install pinned build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-build.txt

      - name: Guard the public source tree
        shell: pwsh
        run: .\tools\check-public-repo.ps1

      - name: Run unit tests
        run: python -m unittest discover -v

      - name: Verify local route-harness unit tests
        run: python -m unittest discover -s tools -p test_*integration.py -v

      - name: Verify safe source export
        run: python -m unittest discover -s tools -p test_public_source_export.py -v

      - name: Run source self-test
        run: python .\nevision_win.py --self-test

      - name: Verify release tooling
        shell: pwsh
        run: .\tools\test-release-tools.ps1

      # Published artifacts require source-built Chromium and cannot be
      # represented by a misleading launcher-only CI archive.
      # Packaged QA is performed on the actual manually built release ZIP.
