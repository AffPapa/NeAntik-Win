name: Bug report
description: Report a reproducible NeVision Win problem without private data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach `Data/`, browser profiles, cookies, databases, backups, proxy credentials,
        certificates or unredacted screenshots/logs. Use SECURITY.md for vulnerabilities.
  - type: input
    id: version
    attributes:
      label: NeVision Win version
      placeholder: 0.1.3-preview
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and display scaling
      placeholder: Windows 11 24H2, 150%
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser used
      placeholder: Chrome 136 / Edge 136
  - type: textarea
    id: steps
    attributes:
      label: Redacted steps to reproduce
      placeholder: Describe only safe, non-sensitive steps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed all profile, cookie, account, proxy and local-path data.
          required: true
