name: Feature request
description: Suggest a small, local-first improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed local-first solution
    validations:
      required: true
  - type: checkboxes
    id: boundary
    attributes:
      label: Product boundary
      options:
        - label: This request does not require fingerprint spoofing, anti-fraud bypass, account automation or cloud collection of profile data.
          required: true
